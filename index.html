<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F472B6">
  <title>我的支出</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- 總覽 -->
    <section id="home" class="screen active">
      <header class="header">
        <h1><span class="emoji">🌈</span>總覽</h1>
        <p class="subtitle">今天也要好好記帳呀</p>
      </header>
      <div class="placeholder">總覽畫面骨架<br>（之後會放入本月花費等內容）</div>

      <div class="storage-test" id="storage-test">
        <p class="storage-test-label">資料儲存測試</p>
        <p class="storage-test-count">已儲存 <strong id="storage-count">0</strong> 筆</p>
        <div class="storage-test-actions">
          <button type="button" class="storage-btn" id="add-test-record">加入一筆測試資料</button>
          <button type="button" class="storage-btn storage-btn-ghost" id="clear-test-records">清除測試資料</button>
        </div>
        <p class="storage-test-note">這是暫時測試。關閉 App 再打開，數字應該還在。</p>
      </div>
    </section>

    <!-- 紀錄 -->
    <section id="transactions" class="screen">
      <header class="header">
        <h1><span class="emoji">📒</span>紀錄</h1>
      </header>
      <div class="placeholder">紀錄列表骨架</div>
    </section>

    <!-- 分析 -->
    <section id="analytics" class="screen">
      <header class="header">
        <h1><span class="emoji">📊</span>分析</h1>
      </header>
      <div class="placeholder">分析畫面骨架</div>
    </section>

    <!-- 新增 -->
    <section id="add" class="screen">
      <header class="header">
        <h1><span class="emoji">➕</span>新增</h1>
      </header>
      <div class="placeholder">新增交易骨架</div>
    </section>

    <button class="fab" id="fab">+</button>

    <nav class="tab-bar">
      <button class="tab active" data-screen="home">
        <span class="icon">🏠</span>
        總覽
      </button>
      <button class="tab" data-screen="transactions">
        <span class="icon">📒</span>
        紀錄
      </button>
      <button class="tab" data-screen="analytics">
        <span class="icon">📊</span>
        分析
      </button>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
