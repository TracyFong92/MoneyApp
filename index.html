<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F472B6">
  <title>我的支出</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- 總覽 -->
    <section id="home" class="screen active">
      <header class="header">
        <h1><span class="emoji">🌈</span>總覽</h1>
        <p class="subtitle">今天也要好好記帳呀</p>
      </header>
      <div class="placeholder">總覽畫面骨架<br>（之後會放入本月花費等內容）</div>
    </section>

    <!-- 紀錄 -->
    <section id="transactions" class="screen">
      <header class="header">
        <h1><span class="emoji">📒</span>紀錄</h1>
        <p class="subtitle">點一下可以修改</p>
      </header>
      <div id="transaction-list"></div>
    </section>

    <!-- 分析 -->
    <section id="analytics" class="screen">
      <header class="header">
        <h1><span class="emoji">📊</span>分析</h1>
      </header>
      <div class="placeholder">分析畫面骨架</div>
    </section>

    <!-- 新增 -->
    <section id="add" class="screen">
      <header class="header">
        <h1><span class="emoji" id="form-emoji">➕</span><span id="form-title-text">新增</span></h1>
      </header>
      <form id="add-form">
        <div class="add-hero">
          <div class="currency">HK$</div>
          <input id="amount-input" class="amount-big" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="金額">
        </div>
        <p class="form-error" id="form-error" hidden></p>
        <div class="input-card">
          <label for="merchant-input">商家名稱</label>
          <input id="merchant-input" type="text" maxlength="40" placeholder="例如：麥當勞" autocomplete="off">
        </div>
        <div class="input-card">
          <label for="date-input">日期</label>
          <input id="date-input" type="date">
        </div>
        <div class="input-card">
          <p class="field-label">選擇類別</p>
          <div class="chips" id="category-chips"></div>
        </div>
        <button class="save-btn" id="save-btn" type="submit">儲存這筆</button>
        <button class="delete-btn" id="delete-btn" type="button" hidden>刪除這筆</button>
      </form>
    </section>

    <button class="fab" id="fab">+</button>

    <nav class="tab-bar">
      <button class="tab active" data-screen="home">
        <span class="icon">🏠</span>
        總覽
      </button>
      <button class="tab" data-screen="transactions">
        <span class="icon">📒</span>
        紀錄
      </button>
      <button class="tab" data-screen="analytics">
        <span class="icon">📊</span>
        分析
      </button>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
