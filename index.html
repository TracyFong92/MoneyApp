<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F472B6">
  <title>我的支出</title>
  <link rel="stylesheet" href="css/style.css?v=13">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- 總覽 -->
    <section id="home" class="screen active">
      <header class="header">
        <h1><span class="emoji">🌈</span>總覽</h1>
        <p class="subtitle">今天也要好好記帳呀</p>
      </header>
      <button type="button" class="pending-banner" id="pending-banner" hidden>
        <span id="pending-count">0</span> 筆待確認，點這裡快速確認
      </button>
      <div class="hero-card">
        <p class="hero-label">本月花費</p>
        <p class="hero-amount" id="month-total">HK$ 0</p>
      </div>
      <div class="mini-cards">
        <div class="mini-card peach">
          <p class="mini-label">今日</p>
          <p class="mini-amount" id="today-total">HK$ 0</p>
        </div>
        <div class="mini-card mint">
          <p class="mini-label">本週</p>
          <p class="mini-amount" id="week-total">HK$ 0</p>
        </div>
      </div>
      <h2 class="section-title">類別分佈</h2>
      <div id="home-categories"></div>
    </section>

    <!-- 紀錄 -->
    <section id="transactions" class="screen">
      <header class="header">
        <h1><span class="emoji">📒</span>紀錄</h1>
        <p class="subtitle">點一下可以修改</p>
      </header>
      <div id="transaction-list"></div>
    </section>

    <!-- 分析 -->
    <section id="analytics" class="screen">
      <header class="header">
        <h1><span class="emoji">📊</span>分析</h1>
        <p class="subtitle">本月各類別占比</p>
      </header>
      <div id="analytics-categories"></div>
    </section>

    <!-- 新增 -->
    <section id="add" class="screen">
      <header class="header">
        <h1><span class="emoji" id="form-emoji">➕</span><span id="form-title-text">新增</span></h1>
      </header>
      <form id="add-form">
        <div class="add-hero">
          <div class="currency">HK$</div>
          <input id="amount-input" class="amount-big" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="金額">
        </div>
        <p class="form-error" id="form-error" hidden></p>
        <div class="input-card">
          <label for="merchant-input">商家名稱</label>
          <input id="merchant-input" type="text" maxlength="40" placeholder="例如：麥當勞" autocomplete="off">
        </div>
        <div class="input-card">
          <label for="date-input">日期</label>
          <input id="date-input" type="date">
        </div>
        <div class="input-card">
          <p class="field-label">選擇類別</p>
          <div class="chips" id="category-chips"></div>
          <p class="category-hint" id="category-hint" hidden></p>
        </div>
        <button class="save-btn" id="save-btn" type="submit">儲存這筆</button>
        <button class="delete-btn" id="delete-btn" type="button" hidden>刪除這筆</button>
      </form>
    </section>

    <button class="fab" id="fab">+</button>

    <button type="button" class="menu-btn" id="menu-btn" aria-label="開啟選單">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="side-menu" id="side-menu">
      <button type="button" class="menu-backdrop" id="menu-backdrop" aria-label="關閉選單"></button>
      <aside class="menu-panel">
        <div class="menu-head">
          <h2>選單</h2>
          <button type="button" class="menu-close" id="menu-close">關閉</button>
        </div>
        <button type="button" class="menu-item" id="open-backup">備份</button>
      </aside>
    </div>
    <div class="sheet" id="backup-sheet">
      <button type="button" class="menu-backdrop" id="sheet-backdrop" aria-label="關閉備份"></button>
      <div class="sheet-panel">
        <div class="sheet-handle"></div>
        <h2 class="sheet-title">備份</h2>
        <p class="backup-note">換手機或清除瀏覽器前，請先匯出。檔案只會存在你的裝置裡。</p>
        <button type="button" class="backup-btn" id="export-btn">匯出備份</button>
        <button type="button" class="backup-btn backup-btn-ghost" id="import-btn">匯入備份</button>
        <label class="backup-btn backup-btn-ghost" id="choose-backup" for="import-file" hidden>選擇備份檔</label>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
        <button type="button" class="backup-btn backup-btn-danger" id="import-confirm" hidden>再按一次，確定取代目前資料</button>
        <p class="backup-message" id="backup-message" hidden></p>
      </div>
    </div>

    <nav class="tab-bar">
      <button class="tab active" data-screen="home">
        <span class="icon">🏠</span>
        總覽
      </button>
      <button class="tab" data-screen="transactions">
        <span class="icon">📒</span>
        紀錄
      </button>
      <button class="tab" data-screen="analytics">
        <span class="icon">📊</span>
        分析
      </button>
    </nav>
  </div>

  <script src="js/storage.js?v=7"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
